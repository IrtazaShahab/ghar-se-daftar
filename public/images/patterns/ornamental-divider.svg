<svg viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <!-- Pakistani ornamental pattern divider -->
  <defs>
    <pattern id="ornament" x="0" y="0" width="100" height="60" patternUnits="userSpaceOnUse">
      <!-- Center element -->
      <circle cx="50" cy="30" r="8" fill="#8b5a2b" opacity="0.6"/>
      <!-- Left flourish -->
      <path d="M 30 20 Q 40 30 30 40" stroke="#8b5a2b" stroke-width="2" fill="none" opacity="0.4"/>
      <!-- Right flourish -->
      <path d="M 70 20 Q 60 30 70 40" stroke="#8b5a2b" stroke-width="2" fill="none" opacity="0.4"/>
      <!-- Top decorative elements -->
      <circle cx="35" cy="10" r="3" fill="#d4a373" opacity="0.5"/>
      <circle cx="50" cy="5" r="3" fill="#d4a373" opacity="0.5"/>
      <circle cx="65" cy="10" r="3" fill="#d4a373" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1000" height="60" fill="url(#ornament)"/>
</svg>
